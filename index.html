<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="bs-calendar — zero-dependency Bikram Sambat ⇄ Gregorian calendar library for JavaScript and React. Guides, API reference, and the full data-verification methodology." />
    <meta name="theme-color" content="#FBF9F5" />
    <title>bs-calendar — Bikram Sambat dates, done exactly</title>
    <script>
      // Apply the persisted theme before first paint (no dark-mode flash).
      try {
        var t = localStorage.getItem('bsc-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
